  <style>
/* ═══════════════════════════════════════
   RESET
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; border: 0; margin: 0; padding: 0; }
html { scrollbar-width: none; }
::-webkit-scrollbar { display: none; }

/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root {
  --bg:     #f6f6f6;
  --black:  #1a1a1a;
  --grey:   #9f9f9f;
  --white:  #ffffff;
  --border: #e4e4e4;
  --h1-size: 3.2rem;
  --h2-size: 2.4rem;
  --ease-spring: cubic-bezier(0.075, 0.82, 0.165, 1);
  --ease-out:    cubic-bezier(0, 0, 0.2, 1);
}

/* ═══════════════════════════════════════
   ROOT
═══════════════════════════════════════ */
html {
  font-size: 0.694445vw; /* ~10px @ 1440px */
  font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  color: var(--black);
  height: 100%;
}

body {
  background: var(--bg);
  overflow-x: hidden;
  line-height: 1;
  min-height: 100vh;
}

a  { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { font: inherit; cursor: pointer; background: none; color: inherit; }
img, svg, canvas { display: block; vertical-align: middle; }
h1, h2, h3 { font-weight: 400; }
a:focus-visible, button:focus-visible, input:focus-visible {
  outline: 2px solid var(--black);
  outline-offset: 3px;
  border-radius: 4px;
}

/* ═══════════════════════════════════════
   TOP/BOTTOM EDGE FADES
═══════════════════════════════════════ */
#edge-fade {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 200;
}
#edge-fade::before, #edge-fade::after {
  content: '';
  position: absolute;
  left: 0;
  width: 100%;
  height: 3rem;
}
#edge-fade::before { top: 0;    background: linear-gradient(to bottom, var(--bg), transparent); }
#edge-fade::after  { bottom: 0; background: linear-gradient(to top,   var(--bg), transparent); }

/* ═══════════════════════════════════════
   SITE LOGO — fixed top-left, all pages
═══════════════════════════════════════ */
.site-logo {
  position: fixed;
  top: 3.5rem;
  left: 3.5rem;
  z-index: 210;
  width: 5rem;
  height: 5rem;
  border-radius: 1.2rem;
  overflow: hidden;
  box-shadow: 0 0.4rem 1.6rem rgba(0, 0, 0, 0.14);
  transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-out);
}
.site-logo:hover {
  transform: translateY(-0.2rem);
  box-shadow: 0 0.8rem 2.4rem rgba(0, 0, 0, 0.18);
}
.site-logo:focus-visible {
  outline: 2px solid var(--black);
  outline-offset: 3px;
  border-radius: 4px;
}
.site-logo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ═══════════════════════════════════════
   SOCIAL BUTTON — pill
═══════════════════════════════════════ */
.social-button {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  height: 5.4rem;
  min-width: 5.4rem;
  padding-inline: 2rem;
  border-radius: 15.5417px;
  background: var(--white);
  cursor: pointer;
  position: relative;
  pointer-events: auto;
  transition:
    scale       0.3s cubic-bezier(0.075, 0.82, 0.165, 1),
    background  0.3s cubic-bezier(0.785, 0.135, 0.15, 0.86),
    color       0.3s cubic-bezier(0.785, 0.135, 0.15, 0.86);
  will-change: transform;
  white-space: nowrap;
  gap: 1rem;
}
.social-button:hover { scale: 1.037; }
.social-button:active { scale: 0.97; }
.social-button--icon { padding-inline: 0; width: 5.4rem; }
.social-button--dark { background: var(--black); color: var(--white); }
.social-button--dark:hover { background: #333; }
.social-button:disabled { opacity: 0.55; pointer-events: none; }

/* ═══════════════════════════════════════
   WAITLIST FORM
═══════════════════════════════════════ */
.waitlist-form {
  display: flex;
  gap: 0.8rem;
  align-items: center;
  flex-wrap: wrap;
}
.waitlist-input {
  height: 5.4rem;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 15.5417px;
  padding: 0 1.6rem;
  font-family: inherit;
  font-size: 1.4rem;
  color: var(--black);
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  width: 12rem;
}
.waitlist-input[type="email"] { width: 18rem; }
.waitlist-input::placeholder { color: var(--grey); }
.waitlist-input:focus {
  border-color: var(--black);
  box-shadow: 0 0 0 1px var(--black);
}
.submit-btn { padding: 0 2.4rem; width: auto; }
.waitlist-status {
  min-height: 1.6rem;
  font-size: 1.2rem;
  line-height: 1.5;
  color: var(--grey);
  margin-top: 1rem;
}
.waitlist-status.ok  { color: #2f7d43; }
.waitlist-status.err { color: #b3382c; }

/* ═══════════════════════════════════════
   HOME VIEW — fixed left identity panel
═══════════════════════════════════════ */
.home-left {
  position: fixed;
  top: 0;
  left: 25.7rem;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 5rem;
  z-index: 50;
  pointer-events: none;
  transition: opacity 0.45s var(--ease-out), transform 0.45s var(--ease-spring);
}
.home-left.hidden {
  opacity: 0;
  transform: translateX(-5.7rem);
  pointer-events: none !important;
}

.identity { display: flex; flex-direction: column; gap: 0.2rem; }

.name-wrap, .role-wrap { overflow: hidden; position: relative; width: 40rem; }
.name-wrap { padding-bottom: 0.4rem; }
.role-wrap { padding-bottom: 0.8rem; }

h1.site-name {
  font-size: var(--h1-size);
  line-height: 1;
  color: var(--black);
  animation: slideUp 0.7s 0.05s var(--ease-out) both;
}
.site-role {
  font-size: var(--h1-size);
  font-weight: 400;
  line-height: 1;
  color: var(--grey);
  animation: slideUp 0.7s 0.13s var(--ease-out) both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(100%); }
  to   { opacity: 1; transform: translateY(0); }
}

.home-btns {
  display: flex;
  gap: 0.4rem;
  pointer-events: auto;
  animation: fadeUp 0.6s 0.28s var(--ease-out) both;
  clip-path: inset(-6% -100%);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(1.5rem); }
  to   { opacity: 1; transform: translateY(0); }
}

.home-note {
  font-size: 1.05rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--grey);
  animation: fadeUp 0.6s 0.34s var(--ease-out) both;
  clip-path: inset(-6% -100%);
}

/* ═══════════════════════════════════════
   HOME RIGHT — project cards
═══════════════════════════════════════ */
#home-cards {
  position: fixed;
  top: 50%;
  right: 25rem;
  left: auto;
  transform: translateY(-50%);
  z-index: 30;
  pointer-events: none;
  transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-spring);
  display: grid;
}
#home-cards.hidden {
  opacity: 0;
  transform: translateY(-50%) translateX(3rem);
  pointer-events: none !important;
}

.home-card {
  grid-area: 1 / 1;
  position: relative;
  width: 33.5rem;
  height: 34.4rem;
  pointer-events: none;
  opacity: 0;
  will-change: transform, opacity, filter;
  transform-origin: center center;
}

.hcard-reflection {
  position: absolute;
  left: 12%;
  right: 12%;
  bottom: -5.5rem;
  height: 3.5rem;
  background: rgba(0,0,0,0.5);
  transform: perspective(20rem) rotateX(65deg);
  filter: blur(1.2rem);
  opacity: 0.15;
  pointer-events: none;
  z-index: -2;
}

.hcard-ambient-shadow {
  position: absolute;
  inset: 0;
  border-radius: 3rem;
  box-shadow: 0 2.5rem 6rem rgba(0,0,0,0.08), 0 0.8rem 2rem rgba(0,0,0,0.04);
  pointer-events: none;
  z-index: -1;
}

.hcard-visual {
  width: 33.5rem;
  height: 34.4rem;
  border-radius: 3rem;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: scale 0.4s var(--ease-spring);
  will-change: transform;
}
.hcard-visual:hover { scale: 1.012; }
.hcard-visual:active { scale: 0.99; }
.hcard-visual svg {
  width: 100%;
  height: 100%;
  display: block;
}

.hcard-title {
  position: absolute;
  bottom: 3rem;
  left: 3rem;
  font-size: var(--h2-size);
  color: var(--white);
  mix-blend-mode: exclusion;
  margin: 0;
  pointer-events: none;
}

/* Instant-swap helper — used so the zoomed home card and the detail
   hero swap without a visible crossfade (they are pixel-identical). */
.no-fade { transition: none !important; }

/* The detail hero card is the zoomed home card, continued:
   same size/position at reveal, then scrolls normally with the page. */
.pcard.pcard-hero { position: static; }
.pcard-visual { position: relative; }
.pcard-hero-title {
  position: absolute;
  bottom: 6.2rem;
  left: 6.2rem;
  font-size: 4.9rem;
  color: var(--white);
  mix-blend-mode: exclusion;
  margin: 0;
  pointer-events: none;
}

/* ═══════════════════════════════════════
   SCROLL SPACER
═══════════════════════════════════════ */
#scroll-spacer { pointer-events: none; width: 1px; }

/* ═══════════════════════════════════════
   SCROLL DOTS + HINT
═══════════════════════════════════════ */
.scroll-dots {
  position: fixed;
  top: 50%;
  right: 8rem;
  left: auto;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  z-index: 50;
  transition: opacity 0.3s;
}
.scroll-dots.hidden { opacity: 0; pointer-events: none; }

.sdot {
  width: 0.3rem;
  height: 0.3rem;
  border-radius: 50%;
  background: var(--border);
  cursor: pointer;
  border: none;
  transition: background 0.25s, transform 0.25s var(--ease-spring);
  pointer-events: auto;
}
.sdot.active { background: var(--black); transform: scale(1.6); }

.scroll-hint {
  position: fixed;
  bottom: 3.2rem;
  right: 8.1rem;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
  opacity: 0;
  animation: fadeIn 0.5s 1.3s ease forwards;
  transition: opacity 0.4s ease;
}
.scroll-hint.gone { opacity: 0 !important; animation: none; }
.scroll-hint__line {
  width: 1px; height: 4rem;
  background: var(--border);
  position: relative; overflow: hidden;
}
.scroll-hint__line::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--grey);
  animation: slideDown 1.6s 1.5s ease infinite;
}
@keyframes slideDown { 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }
.scroll-hint__text {
  font-size: 1rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--grey);
  writing-mode: vertical-rl;
}
@keyframes fadeIn { to { opacity: 1; } }

/* ═══════════════════════════════════════
   PROJECT DETAIL VIEW
═══════════════════════════════════════ */
#project-view {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s var(--ease-out);
  will-change: opacity;
}
#project-view.open {
  opacity: 1;
  pointer-events: auto;
}

#back-btn-wrap {
  position: fixed;
  top: 50%;
  left: 65.6rem;
  margin-top: -30rem;
  margin-left: -7rem;
  z-index: 150;
  opacity: 0;
  pointer-events: none;
  transform: translateX(1rem);
  transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out);
}
#back-btn-wrap.open {
  opacity: 1;
  pointer-events: auto;
  transform: none;
}

/* Project left panel */
#project-left {
  position: fixed;
  top: 0;
  left: 20.0rem;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 5rem;
  z-index: 120;
  pointer-events: none;
  opacity: 0;
  transform: translateX(5.7rem);
  transition: opacity 0.45s var(--ease-out), transform 0.45s var(--ease-spring);
}
#project-left.open {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

.proj-name {
  font-size: var(--h1-size);
  font-weight: 400;
  line-height: 1;
  color: var(--black);
  width: 40rem;
}
.proj-sub {
  font-size: var(--h1-size);
  font-weight: 400;
  line-height: 1;
  color: var(--grey);
  width: 40rem;
}

.proj-btns {
  display: flex;
  gap: 0.4rem;
  pointer-events: auto;
}

/* Right scrollable area */
#project-scroll {
  position: fixed;
  top: 0;
  right: 7.25rem;
  width: 69rem;
  left: auto;
  height: 100vh;
  overflow-y: scroll;
  scrollbar-width: none;
  z-index: 110;
}
#project-scroll::-webkit-scrollbar { display: none; }

.proj-cards {
  padding-top: 15rem;
  padding-bottom: 5rem;
  display: flex;
  flex-direction: column;
  gap: 3.2rem;
}

/* Content cards */
.pcard {
  width: 69rem;
  aspect-ratio: 0.973837 / 1;
  background: hsl(0, 0%, calc(85% + (var(--card-index, 0) * 5%)));
  border-radius: 6.4rem;
  overflow: hidden;
  box-shadow: 0 -0.5rem 2rem rgba(0,0,0,0.03), 0 2rem 4rem rgba(0,0,0,0.06);
  opacity: 0;
  transform: translateY(6rem);
  transition: opacity 0.55s var(--ease-out), transform 0.6s var(--ease-spring);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: calc(4rem + (var(--card-index, 0) * 2.4rem));
  transform-origin: center top;
}
.pcard.vis {
  opacity: 1;
  transform: none;
}

.pcard-inner {
  padding: 5.6rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.pcard__num {
  font-size: 1.2rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 2.4rem;
}

.pcard__title {
  font-size: 3.6rem;
  font-weight: 500;
  line-height: 1.24;
  letter-spacing: -0.015em;
  color: var(--black);
  margin-bottom: 2.4rem;
}

.pcard__body {
  font-size: 1.6rem;
  line-height: 1.65;
  color: var(--grey);
}
.pcard__body p + p { margin-top: 1.6rem; }
.pcard__body code {
  font-family: ui-monospace, monospace;
  background: rgba(0,0,0,0.05);
  padding: 0.15em 0.45em;
  border-radius: 0.4rem;
  font-size: 0.9em;
  color: var(--black);
}

.pcard-visual { width: 100%; height: 100%; }
.pcard-visual svg { width: 100%; height: 100%; display: block; }

/* Terminal */
.terminal {
  background: #111;
  border-radius: 1.4rem;
  padding: 2rem 2.4rem;
  margin-top: auto;
  width: 100%;
  overflow: hidden;
}
.term-hdr { display: flex; gap: 0.6rem; margin-bottom: 1.6rem; }
.dot { width: 1rem; height: 1rem; border-radius: 50%; }
.dr { background: #ff5f56; } .dy { background: #ffbd2e; } .dg { background: #27c93f; }
.term-body { font-family: ui-monospace, 'SFMono-Regular', monospace; font-size: 1.05rem; line-height: 1.85; }
.tl { display: block; color: #d4d4d4; }
.tc { color: #7dd3fc; } .tv { color: #a78bfa; } .ts { color: #86efac; }
.td { color: #525252; } .tw { color: #fbbf24; }
.cursor { display: inline-block; width: 0.5em; height: 1.1em; background: #7dd3fc; vertical-align: text-bottom; animation: blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Feature grid */
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2.4rem; }
.fi { border: 1px solid var(--border); border-radius: 1.4rem; padding: 2.4rem; background: var(--white); }
.fi__title { font-size: 1.3rem; font-weight: 500; color: var(--black); margin-bottom: 0.8rem; }
.fi__desc  { font-size: 1.15rem; line-height: 1.6; color: var(--grey); }

/* Stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); margin-top: 2.4rem; }
.stat { padding: 2.8rem 0; border-bottom: 1px solid var(--border); }
.stat:nth-child(odd)  { border-right: 1px solid var(--border); padding-right: 2.8rem; }
.stat:nth-child(even) { padding-left: 2.8rem; }
.stat__n { display: block; font-size: 4.6rem; font-weight: 300; line-height: 1.1; letter-spacing: -0.04em; color: var(--black); }
.stat__l { display: block; font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey); margin-top: 1rem; }

/* Tags */
.ptags { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 2.4rem; }
.ptag {
  display: inline-flex; align-items: center;
  padding: 0.55rem 1.2rem; border-radius: 999px;
  border: 1px solid var(--border); font-size: 1.05rem;
  color: var(--grey); background: var(--white);
}

/* CTA buttons */
.pcta { display: flex; gap: 1rem; margin-top: 3.2rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.8rem;
  height: 4.8rem; padding-inline: 2.4rem; border-radius: 999px;
  font-size: 1.2rem; font-weight: 400; cursor: pointer;
  text-decoration: none;
  transition: background 0.2s, color 0.2s, scale 0.2s var(--ease-spring);
}
.btn:active { scale: 0.97; }
.btn-d { background: var(--black); color: var(--white); }
.btn-d:hover { background: #333; }

/* ═══════════════════════════════════════
   COMPACT — ≤1024px (tablet & phone)
═══════════════════════════════════════ */
@media (max-width: 1024px) {
  html { font-size: 0.8vw; }

  .home-left {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 3.2rem;
    padding: 9rem 6rem 0;
    background: linear-gradient(to bottom, rgba(246,246,246,0.96) 35%, rgba(246,246,246,0) 95%);
  }
  .name-wrap, .role-wrap { width: 100%; }

  #home-cards {
    top: 66%;
    right: auto;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  #home-cards.hidden { transform: translate(-50%, -50%) translateX(3rem); }

  .scroll-dots { right: 3rem; }
  .scroll-hint { right: 3.2rem; }

  .site-logo { top: 2.4rem; left: 2.4rem; width: 4rem; height: 4rem; border-radius: 1rem; }
  #back-btn-wrap { top: 2.4rem; left: calc(2.4rem + 4rem + 1.4rem); margin: 0; }

  #project-view { overflow-y: auto; }

  #project-left {
    position: static;
    width: 100%;
    height: auto;
    padding: 10rem 6rem 0;
    gap: 3.2rem;
  }
  #project-left .name-wrap, #project-left .role-wrap { width: 100%; }

  #project-scroll {
    position: static;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .proj-cards { padding: 0 6rem 8rem; }
  .pcard { width: 100%; }
}

/* ═══════════════════════════════════════
   PHONE — ≤768px
═══════════════════════════════════════ */
@media (max-width: 768px) {
  html { font-size: 2.6667vw; }

  .home-left { padding: 7rem 4rem 0; gap: 2.8rem; }
  #project-left { padding: 9rem 4rem 0; }
  .proj-cards { padding: 0 4rem 6rem; gap: 2.4rem; }

  .waitlist-input, .waitlist-input[type="email"] { width: 100%; }

  .scroll-dots { right: 2rem; gap: 0.2rem; }
  .sdot { width: 1rem; height: 1rem; margin: 0.5rem 0; }

/* ═══ CONFIG / STATE ═══ */
const isCompact = window.matchMedia('(max-width: 1024px)').matches;
const ZOOM_TARGET = isCompact ? 1 : 2.06;

let currentCardIdx = 0;
let isProjectOpen  = false;
let activeProjectIdx = -1;

/* ═══ DOM REFS ═══ */
const homeLeft     = document.getElementById('homeLeft');
const homeCardsEl  = document.getElementById('home-cards');
const scrollDots   = document.getElementById('scrollDots');
const scrollHint   = document.getElementById('scrollHint');
const scrollSpacer = document.getElementById('scroll-spacer');
const projectView  = document.getElementById('project-view');
const backBtnWrap  = document.getElementById('back-btn-wrap');
const backBtn      = document.getElementById('backBtn');
const projectLeft  = document.getElementById('project-left');
const projName     = document.getElementById('projName');
const projSub      = document.getElementById('projSub');
const projCards    = document.getElementById('projCards');
const projScroll   = document.getElementById('project-scroll');
const srNav        = document.getElementById('sr-nav');
const waitlistForm = document.getElementById('waitlistForm');
const waitlistStatus = document.getElementById('waitlistStatus');

/* ═══ BUILD HOME CARDS ═══ */
function buildHomeCards() {
  homeCardsEl.innerHTML = '';
  scrollDots.innerHTML = '';
  srNav.innerHTML = '';

  PROJECTS.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'home-card' + (i === 0 ? ' active' : '');
    card.id = `hcard-${i}`;

    card.innerHTML = `
      <div class="hcard-ambient-shadow"></div>
      <div class="hcard-reflection"></div>
      <div class="hcard-visual" role="button" tabindex="0"
           aria-label="Open ${p.name}" data-proj="${i}">
        ${p.visual}
        <p class="hcard-title">${p.name}</p>
      </div>`;

    homeCardsEl.appendChild(card);

    card.querySelectorAll('[data-proj]').forEach(el => {
      el.addEventListener('click', () => openProject(i));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProject(i); }
      });
    });

    const dot = document.createElement('button');
    dot.className = 'sdot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', `Go to ${p.name}`);
    dot.addEventListener('click', () => scrollToCard(i));
    scrollDots.appendChild(dot);

    const li = document.createElement('li');
    li.innerHTML = `<a href="#hcard-${i}">${p.name}</a>`;
    srNav.appendChild(li);
  });
}

/* ═══ SCROLL SPACER HEIGHT ═══ */
function setSpacerHeight() {
  scrollSpacer.style.height = '100000vh';
  if (window.scrollY < 10 && window.innerWidth > 1024) {
    const ringJump = (500 - (500 % PROJECTS.length)) * window.innerHeight;
    window.scrollTo({ top: ringJump, behavior: 'instant' });
  }
}

/* ═══ SCROLL ENGINE ═══
   Continuous progress float (winds forever). Each card's visual state is a
   pure function of `index - progress` on a wrapped ring. */
let targetProgress  = 0;
let currentProgress = null;
let globalZoom = 1;
let globalZoomTarget = 1;
let isZoomingIn = false;

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const NEIGHBOR_Y     = prefersReducedMotion ? 28   : 150;
const NEIGHBOR_BLUR  = prefersReducedMotion ? 0    : 4;
const NEIGHBOR_SCALE = prefersReducedMotion ? 0.04 : 0.08;
const SCROLL_LERP    = prefersReducedMotion ? 0.35 : 0.08;

function onScroll() {
  if (isProjectOpen) return;

  const scrollY = window.scrollY;
  const winH    = window.innerHeight;

  /* Infinite wrap: keep the float away from the spacer edges */
  if (scrollY < winH * 10) {
    window.scrollTo({ top: scrollY + winH * 5000, behavior: 'instant' });
    return;
  }
  if (scrollY > winH * 9000) {
    window.scrollTo({ top: scrollY - winH * 5000, behavior: 'instant' });
    return;
  }

  targetProgress = scrollY / winH;

  if (scrollY > winH * 500 + 10) scrollHint.classList.add('gone');
}

function revealProjectView() {
  isZoomingIn = false;
  projectView.setAttribute('aria-hidden', 'false');
  if (isCompact) {
    homeCardsEl.classList.add('hidden');
    projectView.classList.add('open');
  } else {
    /* Desktop: the zoomed home card and the hero card are the same
       SVG at the same size/position — swap them in one instant frame
       so the enlarged card visibly BECOMES the first detail card. */
    globalZoom = ZOOM_TARGET;
    homeCardsEl.classList.add('no-fade', 'hidden');
    projectView.classList.add('no-fade', 'open');
    requestAnimationFrame(() => {
      homeCardsEl.classList.remove('no-fade');
      projectView.classList.remove('no-fade');
    });
  }
  backBtnWrap.classList.add('open');
  projectLeft.classList.add('open');
  setTimeout(() => backBtn.focus(), 350);
}

function renderScroll() {
  globalZoom += (globalZoomTarget - globalZoom) * 0.08;

  if (!isCompact && isZoomingIn && globalZoom >= ZOOM_TARGET * 0.99) {
    revealProjectView();
  }

  if (!isProjectOpen || Math.abs(globalZoomTarget - globalZoom) > 0.01) {
    if (currentProgress === null) currentProgress = targetProgress;
    currentProgress += (targetProgress - currentProgress) * SCROLL_LERP;

    const cards = homeCardsEl.querySelectorAll('.home-card');
    const total = PROJECTS.length;
    const ringProgress = ((currentProgress % total) + total) % total;

    cards.forEach((card, index) => {
      let distance = index - ringProgress;
      if (distance < -total / 2) distance += total;
      if (distance > total / 2) distance -= total;

      const abs = Math.abs(distance);

      if (abs < 0.5 && currentCardIdx !== index) {
        currentCardIdx = index;
        updateScrollUI(index);
      }

      let opacity = 0;
      if (abs <= 1.5) {
        opacity = 1 - Math.min(abs, 1) * 0.9 - Math.max(0, abs - 1) * 0.2;
      }

      if (globalZoom > 1.1 && index !== currentCardIdx) {
        opacity = Math.max(0, opacity - (globalZoom - 1));
      }

      const scale = (1 - Math.min(abs, 1) * NEIGHBOR_SCALE) * globalZoom;
      let y = distance * NEIGHBOR_Y;

      if (index === activeProjectIdx) {
        const zoomProgress = Math.max(0, Math.min(1, (globalZoom - 1) / 1.06));
        y -= (projScroll.scrollTop / scale) * zoomProgress;
      }

      const blur = Math.min(abs, 1) * NEIGHBOR_BLUR;
      const zIndex = 100 - Math.round(abs * 10);

      card.style.transform = `translate3d(0, ${y}px, 0) scale(${scale})`;
      card.style.opacity = opacity;
      card.style.filter = `blur(${blur}px)`;
      card.style.zIndex = zIndex;
      card.style.pointerEvents = (index === currentCardIdx) ? 'auto' : 'none';
    });
  }
  requestAnimationFrame(renderScroll);
}

requestAnimationFrame(renderScroll);

function updateScrollUI(idx) {
  const dots = scrollDots.querySelectorAll('.sdot');
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));

  const cards = homeCardsEl.querySelectorAll('.home-card');
  cards.forEach((c, i) => c.classList.toggle('active', i === idx));
}

function scrollToCard(idx) {
  const scrollY = window.scrollY;
  const winH = window.innerHeight;
  const total = PROJECTS.length;

  const currentFloat = scrollY / winH;
  const currentIdx = Math.floor(currentFloat) % total;

  let diff = idx - currentIdx;
  if (diff < -total / 2) diff += total;
  if (diff > total / 2) diff -= total;

  window.scrollTo({ top: scrollY + (diff * winH), behavior: 'smooth' });
}

/* ═══ KEYBOARD NAV ═══ */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (isProjectOpen) {
    if (e.key === 'Escape') closeProject();
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    scrollToCard(Math.min(PROJECTS.length - 1, currentCardIdx + 1));
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    scrollToCard(Math.max(0, currentCardIdx - 1));
  }
});

/* ═══ OPEN PROJECT ═══ */
function openProject(idx) {
  isProjectOpen = true;
  activeProjectIdx = idx;
  const proj = PROJECTS[idx];

  history.pushState({ project: proj.id }, '', `#/project/${proj.id}`);

  homeLeft.classList.add('hidden');
  scrollDots.classList.add('hidden');
  scrollHint.classList.add('gone');

  projName.textContent = proj.name;
  projSub.textContent = proj.sub;
  buildProjCards(proj);

  document.title = `GlassMarble — ${proj.name}`;

  if (isCompact) {
    revealProjectView();
  } else {
    globalZoomTarget = ZOOM_TARGET;
    isZoomingIn = true;
  }
}

/* ═══ CLOSE PROJECT ═══ */
function closeProject() {
  if (!isProjectOpen) return;

  isProjectOpen = false;
  history.pushState({}, '', '#/');

  projectView.classList.remove('open');
  backBtnWrap.classList.remove('open');
  projectLeft.classList.remove('open');
  projectView.setAttribute('aria-hidden', 'true');

  homeLeft.classList.remove('hidden');
  scrollDots.classList.remove('hidden');
  homeCardsEl.classList.remove('hidden');

  globalZoom = ZOOM_TARGET * 1.1;
  globalZoomTarget = 1;
  isZoomingIn = false;

  document.title = 'GlassMarble — AI Architecture Intelligence for Developers';
  activeProjectIdx = -1;
  window.scrollTo({ top: targetProgress * window.innerHeight, behavior: 'instant' });

  setTimeout(() => {
    const c = homeCardsEl.querySelector('.home-card.active .hcard-visual');
    if (c) c.focus();
  }, 350);
}

/* ═══ BUILD PROJECT CARDS ═══ */
function buildProjCards(proj) {
  projCards.innerHTML = '';

  if (isCompact) {
    projCards.style.paddingTop = '7rem';
  }

  const hero = document.createElement('div');
  hero.className = 'pcard pcard-hero vis';
  hero.innerHTML = `<div class="pcard-visual">${proj.visual}${isCompact ? '' : `<span class="pcard-hero-title">${proj.name}</span>`}</div>`;
  projCards.appendChild(hero);

  if (!isCompact) {
    /* Center the hero exactly where the zoomed home card lands so the
       enlarged card continues seamlessly into the first detail card. */
    const winH = window.innerHeight;
    const heroH = hero.getBoundingClientRect().height;
    projCards.style.paddingTop = `${Math.max(0, (winH - heroH) / 2)}px`;
  }

  proj.cards.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'pcard pcard-detail';
    card.id = `pcard-${i}`;
    card.style.setProperty('--card-index', i);

    const body = c.body ? `<div class="pcard__body">${c.body}</div>` : '';
    const term = c.terminal ? `
      <div class="terminal">
        <div class="term-hdr">
          <div class="dot dr"></div><div class="dot dy"></div><div class="dot dg"></div>
        </div>
        <div class="term-body">${c.terminal}</div>
      </div>` : '';
    const grid = c.grid ? `
      <div class="fgrid">
        ${c.grid.map(g => `
          <div class="fi">
            <h3 class="fi__title">${g.title}</h3>
            <p class="fi__desc">${g.desc}</p>
          </div>`).join('')}
      </div>` : '';
    const stats = c.stats ? `
      <div class="stats">
        ${c.stats.map(s => `
          <div class="stat">
            <span class="stat__n">${s.n}</span>
            <span class="stat__l">${s.l}</span>
          </div>`).join('')}
      </div>` : '';
    const tags = c.tags ? `
      <div class="ptags">
        ${c.tags.map(t => `<span class="ptag">${t}</span>`).join('')}
      </div>` : '';
    const cta = c.cta ? `
      <div class="pcta">
        <button type="button" class="btn btn-d" data-action="waitlist">${c.cta}</button>
      </div>` : '';

    card.innerHTML = `
      <div class="pcard-inner">
        <span class="pcard__num">${c.num}</span>
        <h2 class="pcard__title">${c.title}</h2>
        ${body}${term}${grid}${stats}${tags}${cta}
      </div>`;

    projCards.appendChild(card);
  });

  observeCards();
}

/* ═══ REVEAL CARDS ═══ */
let cardObserver = null;

function observeCards() {
  if (cardObserver) cardObserver.disconnect();
  cardObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('vis');
        cardObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.05, rootMargin: '0px 0px -10% 0px' });

  projCards.querySelectorAll('.pcard-detail').forEach(c => cardObserver.observe(c));

  requestAnimationFrame(() => {
    projCards.querySelectorAll('.pcard-detail').forEach(c => {
      if (c.getBoundingClientRect().top < window.innerHeight * 0.9) c.classList.add('vis');
    });
  });
}

/* ═══ WAITLIST FORM ═══ */
waitlistForm.addEventListener('submit', async e => {
  e.preventDefault();

  const name = waitlistForm.name.value.trim();
  const email = waitlistForm.email.value.trim();

  if (!name) {
    waitlistForm.name.reportValidity();
    return;
  }
  if (!waitlistForm.email.checkValidity()) {
    waitlistForm.email.reportValidity();
    return;
  }

  const btn = waitlistForm.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Joining…';
  waitlistStatus.textContent = '';
  waitlistStatus.className = 'waitlist-status';

  try {
    if (WAITLIST_ENDPOINT) {
      const res = await fetch(WAITLIST_ENDPOINT, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          name,
          email,
          ts: new Date().toISOString(),
          source: 'website'
        }),
        redirect: 'follow'
      });
      const data = await res.json().catch(() => ({}));
      if (!data || data.ok !== true) throw new Error('endpoint rejected');
    } else {
      console.warn('[GlassMarble] WAITLIST_ENDPOINT not configured — showing local success. Setup: see waitlist-apps-script.gs');
    }

    waitlistStatus.textContent = "Thank you! You're on the list.";
    waitlistStatus.className = 'waitlist-status ok';
    waitlistForm.reset();
  } catch (err) {
    waitlistStatus.textContent = 'Something went wrong — please try again.';
    waitlistStatus.className = 'waitlist-status err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Join Waitlist';
  }
});

/* ═══ CTA (join waitlist from detail cards) ═══ */
projCards.addEventListener('click', e => {
  const btn = e.target.closest('[data-action="waitlist"]');
  if (!btn) return;
  closeProject();
  setTimeout(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    waitlistForm.email.focus();
  }, 500);
});

/* ═══ HASH ROUTING ═══ */
function handleRoute() {
  const hash = location.hash;
  if (!hash || hash === '#/' || hash === '#') {
    if (isProjectOpen) closeProject();
    return;
  }
  const m = hash.match(/^#\/project\/(.+)$/);
  if (m) {
    const id  = m[1];
    const idx = PROJECTS.findIndex(p => p.id === id);
    if (idx > -1 && (!isProjectOpen || activeProjectIdx !== idx)) {
      openProject(idx);
    }
  }
}

window.addEventListener('popstate', handleRoute);
window.addEventListener('hashchange', handleRoute);

/* ═══ BACK BUTTON ═══ */
backBtn.addEventListener('click', closeProject);

/* ═══ SCROLL ═══ */
window.addEventListener('scroll', onScroll, { passive: true });

/* ═══ INIT ═══ */
buildHomeCards();
setSpacerHeight();
window.addEventListener('resize', setSpacerHeight);
handleRoute();
updateScrollUI(0);
</script>
